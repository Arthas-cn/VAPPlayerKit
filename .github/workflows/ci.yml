name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Create Swift package workspace
        run: |
          mkdir -p .swiftpm/xcode/package.xcworkspace
          cp .github/package-workspace.xcworkspacedata .swiftpm/xcode/package.xcworkspace/contents.xcworkspacedata
      - name: Test Swift package
        run: |
          xcodebuild \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme VAPPlayerKit \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            test
      - name: Build Swift example
        run: |
          xcodebuild \
            -workspace VAPPlayerKit.xcworkspace \
            -scheme SwiftExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build Objective-C example
        run: |
          xcodebuild \
            -workspace VAPPlayerKit.xcworkspace \
            -scheme ObjectiveCExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
